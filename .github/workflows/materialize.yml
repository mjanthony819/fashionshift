name: materialize-source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify source archive
        run: |
          curl -fSL -o /tmp/src.zip "https://drive.google.com/uc?export=download&id=1SkXELbysBYVA2jE5vpIG2HHdIEgtpv2U"
          echo "19f619bcd909b2b594862779ba4241bf76693e03f62fa6a9643d8dee0344245e  /tmp/src.zip" | sha256sum -c -
      - name: Extract safely into repo root
        run: |
          python3 - <<'PY'
          import zipfile, os, shutil
          with zipfile.ZipFile('/tmp/src.zip') as z:
              bad = z.testzip(); assert bad is None, bad
              for n in z.namelist():
                  p = os.path.normpath(n)
                  assert p == 'FashionShift' or (p.startswith('FashionShift/') and '..' not in p.split(os.sep)), n
              z.extractall('/tmp/fsx')
          root = os.environ['GITHUB_WORKSPACE']
          src = '/tmp/fsx/FashionShift'
          for item in os.listdir(src):
              dest = os.path.join(root, item)
              if os.path.isdir(dest):
                  shutil.rmtree(dest)
              elif os.path.exists(dest):
                  os.remove(dest)
              shutil.move(os.path.join(src, item), dest)
          shutil.copy('/tmp/src.zip', os.path.join(root, 'FashionShift_Complete.zip'))
          PY
      - name: Commit source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix nested demo/docs dirs; materialize complete bundle"
          git push
